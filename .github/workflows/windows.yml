# dev 构建（只由 push 触发）
#
# beta 分支兼管 dev 通道：
#   - push 到 beta -> 自动构建 X.YY.ZZ.Dev
#   - 只上传便携版 Actions artifact，不进入 Release；安装包只在晋升时生成
#
# 手动触发不会产出 dev：手动走 promote.yml，target=beta 产出 beta
# （便携版 zip + 安装包），target=stable 产出正式版。
#
# 基版本来源：仓库变量 XNX_VERSION > VERSION 文件
# 每次 commit 自动把 ZZ+1（自 VERSION 最后一次变更起数 commit），
# 只作用于 dev。beta/stable 晋升时原样继承 dev 的版本号，不再加一。
#
# 后续晋升：
#   promote.yml  target=beta  -> 取最新 dev 产物，改名为 X.YY.ZZ.Beta，发 Release
#   merge-main.yml             -> beta 验证通过后合并进 main
#   promote.yml  target=stable -> 取最新 beta 产物，改名为 X.YY.ZZ，发 Release
name: dev-build

on:
  push:
    branches: [beta]

permissions:
  contents: read

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: read
      actions: write
    env:
      XNX_VERSION: ${{ vars.XNX_VERSION }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # Windows runner 由 CI 用当前 Flutter SDK 生成，不手改、不进仓库。
      - name: Bootstrap Windows runner
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name xnx_player --org com.xnx --no-pub .tmp_scaffold
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          Copy-Item -Recurse .tmp_scaffold/windows ./windows
          Remove-Item -Recurse -Force .tmp_scaffold

      - name: Pub get
        run: flutter pub get

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $base = $env:XNX_VERSION
          if (-not $base) { $base = (Get-Content VERSION -Raw).Trim() }
          # 自动 hotfix：锚定 VERSION 最后一次变更，数它之后有多少 commit。
          # 设置 VERSION 的那次提交是 +0，之后每次提交 +1，只给 dev 用。
          $anchor = (git log -1 --format=%H -- VERSION).Trim()
          $commits = 0
          if ($anchor) { $commits = [int](git rev-list --count "$anchor..HEAD").Trim() }
          $version = (dart tool/version.dart resolve --base "$base" --channel dev --commits $commits | Select-Object -Last 1).Trim()
          if (-not $version) { throw "version resolution returned empty" }
          Write-Host "base=$base commits=$commits version=$version"
          "RESOLVED_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Analyze (gate)
        run: flutter analyze --fatal-warnings

      - name: Unit tests
        run: flutter test --reporter expanded

      - name: Fetch libmpv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MPV_TAG: ${{ vars.MPV_TAG }}
        run: dart run tool/fetch_libmpv.dart

      - name: Build release
        shell: pwsh
        run: flutter build windows --release --no-tree-shake-icons --dart-define=APP_VERSION=$env:RESOLVED_VERSION

      - name: Bundle libmpv and verify
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "xnx_player.exe" | Where-Object { $_.FullName -like "*Release*" } | Select-Object -First 1
          if (-not $exe) { throw "xnx_player.exe not found" }
          $rel = $exe.Directory.FullName
          Write-Host "Release dir: $rel"
          Copy-Item third_party/mpv/libmpv-2.dll "$rel/libmpv-2.dll" -Force
          if (-not (Test-Path "$rel/data/flutter_assets/assets/mpv/player_osd.lua")) { throw "OSD lua missing from bundle" }
          if (-not (Test-Path "$rel/data/flutter_assets/assets/mpv/startup_format_logos.lua")) { throw "format-logo lua missing from bundle" }
          if (-not (Test-Path "$rel/data/flutter_assets/assets/mpv/format-logos/manifest.json")) { throw "format-logo manifest missing from bundle" }
          $badges = (Get-ChildItem "$rel/data/flutter_assets/assets/mpv/format-logos" -Filter "*.bgra" | Measure-Object).Count
          if ($badges -lt 84) { throw "format-logo bitmaps incomplete: $badges (expected 84)" }
          if (-not (Test-Path "$rel/libmpv-2.dll")) { throw "libmpv missing" }
          # version.txt 是运行时 S.appVersion 的首选来源；这里写的是不带 run 的通道版本。
          "$env:RESOLVED_VERSION" | Out-File -FilePath "$rel/version.txt" -Encoding utf8
          # 便携版把数据放在程序目录下的 userdata（不能叫 data：那是 Flutter 的
          # 资源目录）。AppPaths 读到这里就不会落到 %APPDATA%。
          "userdata" | Out-File -FilePath "$rel/data-dir.txt" -Encoding utf8
          # 预留目录随包发布：运行时在 Program Files 下创建目录会撞权限。
          New-Item -ItemType Directory -Force -Path "$rel/log", "$rel/updates" | Out-Null
          "REL_DIR=$rel" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          # dev 只产出便携版（Actions 下载到的就是 zip）。版本不带 run；
          # artifact 名带 run 只为区分多次构建，晋升时按最新读取。
          name: XnX-Player-Portable-${{ env.RESOLVED_VERSION }}-${{ github.run_number }}
          path: ${{ env.REL_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Clean old dev artifacts
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $keep = 5
          $rows = @()
          try {
            $rows = gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .name, .created_at] | @tsv'
          } catch {
            Write-Host "::warning::cannot list artifacts: $($_.Exception.Message)"
            exit 0
          }
          $items = @($rows | Where-Object { $_ -and $_.Trim() -ne '' } | ForEach-Object {
            $parts = $_ -split "`t"
            [pscustomobject]@{ id = $parts[0]; name = $parts[1]; created = $parts[2] }
          } | Where-Object { $_.name -like 'XnX-Player-Portable-*.Dev-*' } | Sort-Object created -Descending)
          if ($items.Count -le $keep) {
            Write-Host "nothing to delete"
            exit 0
          }
          $items | Select-Object -Skip $keep | ForEach-Object {
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$($_.id)"
          }
