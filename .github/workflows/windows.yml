# dev 构建（只由 push 触发）
#
# beta 分支兼管 dev 通道：
#   - push 到 beta -> 自动构建 X.YY.ZZ.Dev
#   - 只上传便携版 Actions artifact，不进入 Release；安装包只在晋升时生成
#
# 手动触发不会产出 dev：手动走 promote.yml，target=beta 产出 beta
# （便携版 zip + 安装包），target=stable 产出正式版。
#
# 基版本唯一来源：VERSION 文件（仓库变量 XNX_VERSION 已停用，避免晋升后陈旧）
# ZZ 是 hotfix 迭代位：每次成功的 dev 构建写回 beta:VERSION.latest，下次构建
# 读它 ZZ+1 —— 一次成功的构建就是一次 hotfix 迭代，失败/被取消不写回、不迭代。
# 从 commit 计数改来，前期密集提交不再把版本号撑大。ZZ 满 99 自动进位到 YY
# （YY 满 99 进位到 X）；VERSION 不被 CI 改写，进位后记录的 base 行仍与它
# 一致，迭代在进位后的号上继续。
# beta/stable 晋升时原样继承 dev 的版本号，只换后缀。
#
# 后续晋升：
#   promote.yml  target=beta  -> 取最新 dev 产物，改名为 X.YY.ZZ.Beta，发 Release
#   merge-main.yml             -> beta 验证通过后合并进 main
#   promote.yml  target=stable -> 取最新 beta 产物，改名为 X.YY.ZZ，发 Release
name: dev-build

on:
  push:
    branches: [beta]

permissions:
  contents: write

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.ver.outputs.version }}
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # Windows runner 由 CI 用当前 Flutter SDK 生成，不手改、不进仓库。
      - name: Bootstrap Windows runner
        shell: pwsh
        run: |
          flutter create --platforms=windows --project-name xnx_player --org com.xnx --no-pub .tmp_scaffold
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          Copy-Item -Recurse .tmp_scaffold/windows ./windows
          Remove-Item -Recurse -Force .tmp_scaffold

      - name: Pub get
        run: flutter pub get

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          # VERSION is the only source of truth. A repo variable (XNX_VERSION)
          # used to take priority here, but it is invisible to the repo and
          # goes stale after every promotion — the reason a later build could
          # pick up an old number. VERSION holds the plain base X.YY.ZZ.
          $base = (Get-Content VERSION -Raw).Trim()
          if ($base -notmatch '^\d+\.\d{2}\.\d{2}$') {
            throw "VERSION must be X.YY.ZZ (two-digit minor/hotfix); got: $base"
          }
          # 计数来源是上一枚成功 dev 构建写回的 VERSION.latest，不是 commit 数：
          # 一次成功的构建 = hotfix 迭代一次（ZZ+1），失败与被取消的构建不写回、
          # 不迭代。这样前期密集提交不会把 stable 继承到的版本号撑大。
          # checkout 是 fetch-depth 0，并发组 cancel-in-progress 保证读与写回
          # 不会同时进行。
          # 记录第二行是构建时的基版本（base: X.YY.ZZ）：判断"基版本变没变"
          # 必须比对构建时的基版本——正常迭代下版本号本身就不等于基数。
          $prevVersion = ''
          $prevBase = ''
          if (Test-Path VERSION.latest) {
            $record = @(Get-Content VERSION.latest | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            if ($record.Count -ge 1) { $prevVersion = $record[0] }
            foreach ($line in $record) {
              if ($line -match '^base:\s*(.+)$') { $prevBase = $Matches[1].Trim() }
            }
          }
          $prevArgs = @()
          if ($prevVersion) { $prevArgs = @('--prev', $prevVersion) }
          if ($prevBase) { $prevArgs += @('--prev-base', $prevBase) }
          $version = (dart tool/version.dart resolve --base "$base" --channel dev @prevArgs | Select-Object -Last 1).Trim()
          if (-not $version) { throw "version resolution returned empty" }
          Write-Host "base=$base prev=${prevArgs -join ' '} version=$version"
          "RESOLVED_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASE_VERSION=$base" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Analyze (gate)
        shell: pwsh
        run: |
          # Echo every diagnostic and re-emit it as a GitHub annotation. The
          # raw log is only visible to signed-in users in the web UI, while
          # annotations are readable from the checks API — which is what an
          # external tool needs to report "file:line: message" instead of a
          # bare "exit code 1".
          #
          # `flutter analyze` treats info as fatal by default, so one missing
          # `const` used to fail a ten-minute build. Infos are now annotations
          # only; warnings and errors still stop the build.
          $lines = & flutter analyze --fatal-warnings --no-fatal-infos 2>&1
          $code = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          # Non-TTY output separates fields with " - ", not " • ", so the old
          # matcher never fired and failures arrived as a bare exit code.
          foreach ($line in $lines) {
            if ($line -match '^\s*(error|warning)\s+-\s') {
              Write-Host "::error::$line"
            } elseif ($line -match '^\s*info\s+-\s') {
              Write-Host "::warning::$line"
            }
          }
          exit $code

      - name: Unit tests
        run: flutter test --reporter expanded

      - name: Fetch libmpv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MPV_TAG: ${{ vars.MPV_TAG }}
        run: dart run tool/fetch_libmpv.dart

      - name: Build release
        shell: pwsh
        run: flutter build windows --release --no-tree-shake-icons --dart-define=APP_VERSION=$env:RESOLVED_VERSION

      - name: Bundle libmpv and verify
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "xnx_player.exe" | Where-Object { $_.FullName -like "*Release*" } | Select-Object -First 1
          if (-not $exe) { throw "xnx_player.exe not found" }
          $rel = $exe.Directory.FullName
          Write-Host "Release dir: $rel"
          Copy-Item third_party/mpv/libmpv-2.dll "$rel/libmpv-2.dll" -Force
          if (-not (Test-Path "$rel/data/flutter_assets/assets/mpv/player_osd.lua")) { throw "OSD lua missing from bundle" }
          if (-not (Test-Path "$rel/data/flutter_assets/assets/mpv/startup_format_logos.lua")) { throw "format-logo lua missing from bundle" }
          if (-not (Test-Path "$rel/data/flutter_assets/assets/mpv/format-logos/manifest.json")) { throw "format-logo manifest missing from bundle" }
          $badges = (Get-ChildItem "$rel/data/flutter_assets/assets/mpv/format-logos" -Filter "*.bgra" | Measure-Object).Count
          if ($badges -lt 84) { throw "format-logo bitmaps incomplete: $badges (expected 84)" }
          if (-not (Test-Path "$rel/libmpv-2.dll")) { throw "libmpv missing" }
          # version.txt 是运行时 S.appVersion 的首选来源；这里写的是不带 run 的通道版本。
          "$env:RESOLVED_VERSION" | Out-File -FilePath "$rel/version.txt" -Encoding utf8
          # 便携版把数据放在程序目录下的 userdata（不能叫 data：那是 Flutter 的
          # 资源目录）。AppPaths 读到这里就不会落到 %APPDATA%。
          "userdata" | Out-File -FilePath "$rel/data-dir.txt" -Encoding utf8
          # 预留目录随包发布：运行时在 Program Files 下创建目录会撞权限。
          New-Item -ItemType Directory -Force -Path "$rel/log", "$rel/updates" | Out-Null
          "REL_DIR=$rel" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          # dev 只产出便携版（Actions 下载到的就是 zip）。名字里只有版本号：
          # run 序号是 CI 内部概念，不该出现在用户看到的产物名上。
          # 同一个版本重跑会覆盖同名产物，而不是生成 `...-41-1`。
          name: XnX-Player-Portable-${{ env.RESOLVED_VERSION }}
          path: ${{ env.REL_DIR }}
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      # The dev channel reads a Release, not an Actions artifact: the artifact
      # download endpoint authenticates even on a public repository, so a
      # normal desktop install could never self-update. A nightly prerelease
      # carries the same portable zip as an anonymous-downloadable asset.
      - name: Publish nightly release
        if: success() && github.ref_name == 'beta' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "nightly-$env:RESOLVED_VERSION"
          $zip = Join-Path $env:RUNNER_TEMP "XnX-Player-Portable-$env:RESOLVED_VERSION.zip"
          Compress-Archive -Path "$env:REL_DIR\*" -DestinationPath $zip -Force
          gh release delete $tag --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "no previous nightly; creating fresh" }
          # Keep the Releases page to a single dev entry. A dev build is a
          # moving target and an old nightly is both stale and noise, so every
          # other nightly-* release is removed before this one is published.
          $stale = gh release list --limit 100 --json tagName,isPrerelease `
            --jq '.[] | select(.isPrerelease) | select(.tagName | startswith("nightly-")) | .tagName'
          foreach ($old in @($stale | Where-Object { $_ -and $_.Trim() -and $_ -ne $tag })) {
            gh release delete $old --yes --cleanup-tag
            Write-Host "removed stale $old"
          }
          gh release create $tag $zip --prerelease `
            --title "Dev $env:RESOLVED_VERSION" `
            --notes "beta 分支自动构建（未验证）· 构建于 $(Get-Date -AsUtc -Format 'yyyy-MM-ddTHH:mm:ssZ')"
          Write-Host "published $tag"

      # Record the version this run actually produced back in the repository.
      # The build artifact already carries it in its name and version.txt, but
      # nothing on the repo side did — so the next build had to re-derive the
      # number, and a stale XNX_VERSION variable could silently win. Writing a
      # dedicated record gives the hotfix iteration counter its home: the next
      # build reads it and advances one iteration, so a build that fails or is
      # cancelled never moves the number. VERSION stays untouched (rewriting it
      # would restart the counter at the new base) and the record doubles as
      # the "what did dev ship last" evidence promote cross-checks.
      - name: Persist dev version to repository
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "$env:RESOLVED_VERSION"
          if (-not $version) { throw 'RESOLVED_VERSION is empty; refusing to write' }
          $base = "$env:BASE_VERSION"
          if (-not $base) { throw 'BASE_VERSION is empty; refusing to write' }
          # 第一行是 dev 版本（promote 只读这一行），第二行是构建时的基版本，
          # 供下次构建判断 VERSION 变没变。两行都缺不得，缺一行计数就回退。
          $current = ''
          if (Test-Path VERSION.latest) {
            $first = Get-Content VERSION.latest | Select-Object -First 1
            if ($first) { $current = $first.Trim() }
          }
          if ($current -eq $version) {
            Write-Host "VERSION.latest already $version; nothing to commit"
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'VERSION.latest'), "$version`nbase: $base`n", (New-Object System.Text.UTF8Encoding($false)))
          git add VERSION.latest
          # [skip ci] prevents this bookkeeping commit from triggering another
          # dev build; push targets the branch that started this run.
          git commit -m "chore(version): record dev $version [skip ci]"
          $branch = "${{ github.ref_name }}"
          git push origin "HEAD:$branch"

      - name: Clean old dev artifacts
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Promotion is manual and usually happens after some review, by which
          # time several more dev builds may exist. Keeping only the newest few
          # meant "the build that passed" could be deleted before it was
          # promoted; 10 covers a normal review window.
          $keep = 10
          $rows = @()
          try {
            $rows = gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .name, .created_at] | @tsv'
          } catch {
            Write-Host "::warning::cannot list artifacts: $($_.Exception.Message)"
            exit 0
          }
          $items = @($rows | Where-Object { $_ -and $_.Trim() -ne '' } | ForEach-Object {
            $parts = $_ -split "`t"
            [pscustomobject]@{ id = $parts[0]; name = $parts[1]; created = $parts[2] }
          } | Where-Object { $_.name -like 'XnX-Player-Portable-*.Dev*' } | Sort-Object created -Descending)
          if ($items.Count -le $keep) {
            Write-Host "nothing to delete"
            exit 0
          }
          $items | Select-Object -Skip $keep | ForEach-Object {
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$($_.id)"
          }
