name: xnx_player
description: "XnX Player — PlayStation 5 styled media player powered by mpv."
publish_to: "none"
version: 0.1.0+1

environment:
  # material_ui 1.x 要求 Dart ^3.13 与 Flutter >=3.47；Flutter 3.47 起
  # package:flutter/material.dart 已废弃，Material 库迁到独立包。
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  ffi: ^2.1.3
  file_selector: ^1.0.3
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mpv/
    # Subdirectories are not included by a folder entry; the format badges need
    # their own line or `overlay-add` finds no manifest at runtime.
    - assets/mpv/format-logos/
    # Interface cues, one folder per sound set (see lib/core/sound).
    - assets/audio/sfx/glass/
